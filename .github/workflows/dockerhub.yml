name: Push Container Image

on:
  push:
    tags:
        - 'v*.*.*'
  workflow_dispatch:

env:
  # Override with a repository variable (Settings > Variables) in forks.
  IMAGE: ${{ vars.DOCKERHUB_IMAGE || 'ddvk/rmfakecloud' }}

jobs:
  # One job per platform on a native runner where possible: the C++ build of
  # librm_lines is 6-10x slower under QEMU. Each job pushes its image by
  # digest only; the merge job below creates the tagged multi-arch manifest.
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            rmlines: 1
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            rmlines: 1
          # No native runner; built under QEMU without the v6 renderer.
          - platform: linux/arm/v7
            runner: ubuntu-latest
            rmlines: 0
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set Version
        run: |
            version="$(git describe --tags)"
            echo "version=$version" >> "$GITHUB_ENV"
            platform=${{ matrix.platform }}
            echo "platform_pair=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Setup QEMU
        if: matrix.platform == 'linux/arm/v7'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and push by digest
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          platforms: ${{ matrix.platform }}
          build-args: |
            VERSION=${{ env.version }}
            RMLINES=${{ matrix.rmlines }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ env.platform_pair }}
          cache-to: type=gha,mode=max,scope=${{ env.platform_pair }}

      - name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.docker_build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.platform_pair }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge manifest
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set Version
        run: |
            version="$(git describe --tags)"
            echo "image_version=${version:1}" >> "$GITHUB_ENV"

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          # shellcheck disable=SC2046 # one argument per digest
          docker buildx imagetools create \
            -t "${IMAGE}:latest" \
            -t "${IMAGE}:${image_version}" \
            $(printf "${IMAGE}@sha256:%s " *)

      - name: Inspect image
        run: docker buildx imagetools inspect "${IMAGE}:${image_version}"
