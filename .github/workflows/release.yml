name: Release

on:
  push:
    tags:
        - 'v*.*.*'

jobs:

  # Static musl binaries with the v6 renderer, built natively per arch from
  # the Dockerfile's gobuilder stage (target "binary").
  rmlines:
    name: Build rmlines ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set Version
        run: echo "version=$(git describe --tags)" >> "$GITHUB_ENV"

      - name: Build binary
        uses: docker/build-push-action@v6
        with:
          platforms: linux/${{ matrix.arch }}
          target: binary
          build-args: |
            VERSION=${{ env.version }}
            RMLINES=1
          outputs: type=local,dest=out
          # read the layer cache written by the container image workflow
          cache-from: type=gha,scope=linux-${{ matrix.arch }}

      - name: Rename binary
        run: mv out/rmfakecloud rmfakecloud-rmlines-${{ matrix.arch }}

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: rmfakecloud-rmlines-${{ matrix.arch }}
          path: rmfakecloud-rmlines-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 1

  build:
    name: Build
    runs-on: ubuntu-24.04
    needs: rmlines
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ^1.23
        id: go

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          version: 9
          run_install: false

      - name: Build 
        run: make all

      - name: Download rmlines binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: rmfakecloud-rmlines-*
          merge-multiple: true

      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*
          generate_release_notes: true
